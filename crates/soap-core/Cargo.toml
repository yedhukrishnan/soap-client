[package]
name = "soap-core"
version = "0.3.0"
edition = "2024"
description = "SOAP client core: WSDL/XSD parsing, sample requests, WS-Security, assertions"
authors = ["Yedhu Krishnan <dev@yedhu.me>"]
repository = "https://github.com/yedhukrishnan/soap-client"
license = "MIT"
publish = false

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
quick-xml = "0.42.0"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "deflate", "charset", "system-proxy"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
uuid = { version = "1.29.3", features = ["v4"] }

[dev-dependencies]
roxmltree = "0.21.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
