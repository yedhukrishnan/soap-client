[package]
name = "soap-client"
version = "0.1.0"
description = "A lightweight SOAP client"
edition = "2024"

[lib]
name = "soap_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
soap-core = { path = "../crates/soap-core" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["sync", "macros"] }
