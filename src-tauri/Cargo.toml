[package]
name = "soap-client"
version = "0.2.2"
description = "A lightweight SOAP client"
authors = ["Yedhu Krishnan <dev@yedhu.me>"]
homepage = "https://yedhu.me"
repository = "https://github.com/yedhukrishnan/soap-client"
license = "MIT"
edition = "2024"
publish = false

[lib]
name = "soap_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
keyring = "4.2.0"
keyring-core = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
soap-core = { path = "../crates/soap-core" }
tauri = { version = "2.12.7", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
tokio = { version = "1.54.1", features = ["sync", "macros"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Data-protection keychain with a "require user presence" (Touch ID) access policy.
apple-native-keyring-store = { version = "1", features = ["keychain", "protected"] }
